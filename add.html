<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>作品を追加 — KODOMO WORLD</title>
<link rel="stylesheet" href="styles.css?v=15">
</head>
<body>
<header>
  <a class="back" href="index.html">← 世界にもどる</a>
  <h1>作品を追加</h1>
  <span class="tag">写真から立体をつくって、世界に住まわせます</span>
  <a class="sublink" href="data.html">データ</a>
</header>

<div class="addwrap">
  <section class="panel">
    <h2>作者（こども）</h2>
    <div class="body">
      <div class="kids" id="kids"></div>
      <div class="kids-empty" id="kidsEmpty">まだ登録がありません。最初にこどもを登録してください。</div>
      <button type="button" class="mini" id="kidAdd">＋ こどもを登録</button>
    </div>
  </section>

  <section class="panel">
    <h2>作品</h2>
    <div class="body">
      <form id="form">
        <div class="step">1. 作品の写真</div>
        <div id="drop"><span class="big">🖼️</span>作品の写真を選ぶ<br><span style="font-size:11px">クリック / ドラッグ＆ドロップ</span></div>
        <input type="file" id="file" accept="image/*" hidden>
        <div id="preview"><img id="prevImg" alt=""><div class="name" id="prevName"></div></div>

        <div id="step3d" hidden>
          <div class="step">2. 3Dにする</div>
          <div id="cutWrap">
            <canvas id="cutCanvas" width="240" height="200"></canvas>
            <div id="cutBusy">かたちを読みとっています…</div>
          </div>
          <label class="check"><input type="checkbox" id="use3d" checked> 背景を抜いて立体にする</label>
          <div id="opt3d">
            <label for="tol">背景の抜き具合 <span class="v" id="tolV"></span></label>
            <input type="range" id="tol" min="6" max="32" value="16">
            <label for="thick">厚み <span class="v" id="thickV"></span></label>
            <input type="range" id="thick" min="4" max="26" value="12">
          </div>
          <div class="hint" id="cutNote"></div>
        </div>

        <div class="step">3. これはなに？</div>
        <div class="roles" id="roles"></div>
        <div class="hint" id="roleHint"></div>

        <div class="step">4. 作品の情報</div>

        <div class="row">
          <div>
            <label for="ageY">制作時の年齢</label>
            <input type="number" id="ageY" min="0" max="20" placeholder="5" required>
          </div>
          <div>
            <label for="ageM">ヶ月（任意）</label>
            <input type="number" id="ageM" min="0" max="11" placeholder="2">
          </div>
        </div>
        <div class="hint" id="ageHint"></div>

        <label for="date">制作日</label>
        <input type="date" id="date" required>

        <label for="title">作品名（子どもがつけた名前）</label>
        <input type="text" id="title" placeholder="赤い怪獣" required>

        <label for="desc">子ども自身の説明</label>
        <textarea id="desc" placeholder="お母さんを守る怪獣"></textarea>
        <div class="hint">本人の言葉をそのまま残してください。</div>

        <button class="btn" type="submit" id="submit">世界に追加する</button>
      </form>

      <div id="done" hidden>
        <div class="done-card">
          <img id="doneImg" alt="">
          <div class="done-title" id="doneTitle"></div>
          <div class="done-meta" id="doneMeta"></div>
          <a class="btn" id="doneSee" href="index.html">🌍 世界で見る</a>
          <button class="btn ghost" type="button" id="doneMore">つづけて追加する</button>
        </div>
      </div>
    </div>
  </section>
</div>

<div class="modal" id="kidModal">
  <div class="modal-card">
    <h3 id="kmTitle">こどもを登録</h3>
    <div class="hint">この情報は端末内にだけ保存されます。実名でなくてかまいません。</div>
    <label for="kmName">表示名</label>
    <input type="text" id="kmName" placeholder="はる" autocomplete="off" maxlength="20">
    <label for="kmBirth">生年月日（任意）</label>
    <input type="date" id="kmBirth">
    <div class="hint">登録すると、制作日から「5歳2ヶ月」まで自動で計算されます。</div>
    <div class="modal-actions">
      <button type="button" class="btn ghost" id="kmCancel">やめる</button>
      <button type="button" class="btn" id="kmSave">保存</button>
    </div>
    <button type="button" class="del" id="kmDelete" style="display:none">このこどもを削除する</button>
  </div>
</div>

<div id="toast"></div>

<script src="modeler.js?v=15"></script>
<script src="core.js?v=15"></script>
<script src="add.js?v=15"></script>
</body>
</html>
