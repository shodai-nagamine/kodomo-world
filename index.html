<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🌱 KODOMO WORLD</title>
<link rel="stylesheet" href="styles.css?v=14">
<link rel="stylesheet" href="gallery.css?v=14">
</head>
<body>
<header>
  <h1>🌱 KODOMO WORLD</h1>
  <span class="tag">子どもの作品が住み続ける世界</span>
  <span class="stat" id="stat"></span>
  <a class="sublink" href="data.html">データ</a>
  <a class="cta" href="add.html">＋ 作品を追加</a>
</header>

<div class="layout world-layout">
  <!-- 世界・ギャラリー・タイムライン -->
  <section class="panel">
    <div class="tabs">
      <button data-v="world" class="on">🌍 作品世界</button>
      <button data-v="archive">🖼 ギャラリー</button>
      <button data-v="timeline">📖 タイムライン</button>
      <button id="modeBtn" class="mode" type="button" style="margin-left:auto">🚶 さんぽする</button>
      <span style="font-size:11px;color:var(--ink-soft);align-self:center;margin-left:10px" id="worldName"></span>
    </div>
    <div class="view on" id="view-world">
      <div id="world3d"></div>
      <div id="worldEmpty">
        <span class="big">🌱</span>
        <span>まだ誰も住んでいません</span>
        <a class="cta" href="add.html">＋ 最初の作品を追加する</a>
      </div>
      <div id="worldHint">ドラッグで見まわす ・ ホイールで近づく ・ キャラクターをドラッグで移動</div>
      <div id="worldTier"></div>
    </div>
    <div class="view" id="view-archive"><div id="archiveBox"></div></div>
    <div class="view" id="view-timeline"><div class="tl" id="tl"></div></div>
  </section>

  <!-- 作品詳細 -->
  <aside class="panel">
    <h2>作品詳細</h2>
    <div class="body" id="detail">
      <div class="empty"><span class="big">👆</span>世界のキャラクターを<br>クリックしてください</div>
    </div>
  </aside>
</div>

<div id="lightbox"><img id="lbImg" alt="元の作品"><div class="cap" id="lbCap"></div></div>
<div id="toast"></div>

<script src="gallery.js?v=14"></script>
<script src="core.js?v=14"></script>
<script src="world.js?v=14"></script>
<script type="module" src="world3d.js?v=14"></script>
</body>
</html>
